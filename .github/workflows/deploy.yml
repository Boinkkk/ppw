name: Deploy to GitHub Pages

on:
  # Trigger workflow ketika ada push ke branch main
  push:
    branches: [ main ]
  # Memungkinkan trigger manual melalui tab Actions di GitHub
  workflow_dispatch:

# Mengatur izin token GitHub Actions untuk publikasi Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Batasi agar deployment yang berjalan tidak saling tumpang tindih
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependensi
        run: npm ci

      - name: Build proyek Astro Starlight
        run: npm run build

      - name: Upload artifact untuk GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
